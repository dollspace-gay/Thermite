# spec-routes.toml — the Thermite route table (single source of truth).
#
# Each route maps a toolchain source file to the design doc that governs it
# and, where one exists, the golden/conformance reference that is the
# external truth for its behavior. The spec-discipline.py hook reads this
# file to enforce "read goal.md + the design doc (+ a reference) before
# editing the file".
#
# Schema:
#   [[route]]
#   crate_pattern   = "<repo-relative path or glob>"   # required
#   design          = ".design/<area>/<doc>.md"        # required; must exist
#   reference       = ["conformance/<name>.th", ...]   # optional; if non-empty,
#                                                       #   >=1 must be Read
#   conformance_ops = ["<corpus program names>"]        # informational
#
# A file with no matching route BLOCKS until a route is added (R-XLATE-2).
# A route whose design doc doesn't exist BLOCKS until acto-doc-author
# authors it (R-XLATE-3).
#
# NOTE: This table doubles as the intended v0.1 module map. The crate/file
# layout below is the target for scaffold issue #1; adjust these routes if
# #1 settles on different paths. Routes are seeded for the v0.1 kernel
# (crosslink milestone #1); v0.2-v0.5 routes are added as the loop reaches
# them.

# ---------------------------------------------------------------------
# scaffold — workspace crate roots (issue #1)
# ---------------------------------------------------------------------

[[route]]
crate_pattern = "thermite-syntax/src/lib.rs"
design = ".design/scaffold/workspace.md"
reference = []
conformance_ops = []

[[route]]
