[[requirement]]
id = "REQ-S2-7"
title = "Stage-2 restratify — Strat/Restratify.lean (T4-R) + forge edit --restratify + PinRestratDropSide"
owner = ".design/stage2-stratified-cage.md"
status = "shipped"
scope = "verified"
summary = "The restratification rewrite + its T4-R metatheory + the forge wiring (stage2-stratified-cage.md REQ-7 / AC-7; child of thermite2-program.md REQ-10; gate G2; spec of record the stage-2 metatheory sketch GH#2 §6). Builds on REQ-1..REQ-6 (#323/#324/#325/#326/#327/#328, all merged @ b61d12e7); unblocks REQ-8 (#330). Operates on REQ-3's CLASSIFIER surface Thermite.Strat.Cls.Frm + its STRUCTURAL fdenote (q : Atom -> Bool over a finite dom : List Tm), NOT REQ-1's minimal spine Frm. THE REWRITE (the §6 kv-alternation repair): the motivating inadmissible formula is the kv cycle ex_kvCycle = (forall k:Key. exists v:Value. v=k) AND (forall v:Value. exists k:Key. k=v), whose sort graph has BOTH E1 edges Key->Value (from A) and Value->Key (from B) = a cycle, so admitted phi = false. restrat breaks it by EXCISING the cycle-closing conjunct B and replacing it with a fresh OPAQUE abstraction p (a qfree leaf — opaque to the classifier, contributing NO sorts and NO graph edges, the §1.2 QFree leaf): phi' = restrat phi = A AND p (only the Key->Value edge -> acyclic -> ADMITTED), and emits the IMPLICATION side obligation Side(phi',phi) = p => B (only the Value->Key edge -> acyclic -> ADMITTED). Neither phi' nor Side carries BOTH edges, so each is admissible alone, yet together they re-establish phi (modus ponens on p). R-SIDE-1 (the load-bearing discipline): a certificate of phi' ALONE never counts for phi — p is a fresh, UNCONSTRAINED abstraction, so A AND p is satisfied trivially by p:=true WITHOUT B holding; only a SEPARATELY DISCHARGED Side (p=>B, itself in-cage) licenses the inference to phi. (1) lean/Thermite/Strat/Restratify.lean: absLeaf/restrat/Side (the rewrite + the obligation) and the FOUR T4-R theorems — restrat_conservative (for ALL (q,dom,rho): fdenote phi' AND fdenote Side => fdenote phi, the R-SIDE-1 certificate bridge, a Boolean tautology = modus ponens on the abstraction's denotation; consumes BOTH hypotheses), restrat_admits (admitted (restrat kvAbs ex_kvCycle) = true, decide) + restrat_moves_into_cage (the original ex_kvCycle is rejected, decide), side_admitted (admitted (Side kvAbs ex_kvCycle) = true, decide — so Side is dischargeable IN-CAGE), and restrat_complete (under the WITNESS oracle q(p)=fdenote B, a model of phi is a model of both phi' and Side — no validity lost). (2) lean/Thermite/PinRestratDropSide.lean (flat Pin*.lean placement, as REQ-1/2/5/6): a boolean-literal oracle qBool with a TRUE A leaf and a FALSE B leaf; dropSide_counterexample shows phi' = A AND p is true (p:=true) while phi = A AND B is false; dropSide_breaks_certification refutes 'phi' certified => phi certified' WITH SIDE DROPPED via decide; side_is_false_here / conservative_withholds_without_side show that under the SAME model the real Side (p=>B) is FALSE so restrat_conservative's Side hypothesis is UNMET (the discipline correctly withholds) — the gap is solely the dropped obligation. (3) thermite-spec/src/restratify.rs (Rust ops-half, mirroring the Lean rewrite over classifier::Frm): abs_leaf/restratify (-> RestratResult{original,rewritten,side}) + certify(phi, side_discharged) -> Certification{Certified|Withheld(WithheldReason)} honouring R-SIDE-1 (WITHHELDs with SideUndischarged when phi' admitted + Side in-cage but Side not discharged) + kv_example; unit-tested kv rejected / phi'+Side both admitted / certified-when-discharged / WITHHELD-when-undischarged / non-conjunction-not-restratifiable. (4) forge edit --restratify [--json] (forge/src/cli.rs run_restratify): runs the kv example end to end — original REJECTED (the opaque0-cycle), phi' ADMITTED, Side ADMITTED, Side DISCHARGED in-cage, phi CERTIFIED — and the report attests R-SIDE-1 (withheld_when_side_undischarged). AC-7 met: forge edit --restratify performs the kv rewrite end to end, emits AND discharges Side in-cage, and a test (forge/tests/restratify.rs certification_withheld_when_side_undischarged + the thermite-spec unit test) proves certification is WITHHELD when Side is undischarged; PinRestratDropSide exists; restrat_conservative/admits/complete + side_admitted proven axiom-clean (in-file + lean-axiom-probe: subset of {propext, Classical.choice, Quot.sound}), zero sorry under lean/Thermite/Strat/, core-Lean-only (Restratify imports only Strat.Fragment; no Mathlib). Thermite.Strat.Restratify + Thermite.PinRestratDropSide wired into scripts/lean-axiom-probe.sh as CI build targets, and Thermite.Strat.Cls.restrat_conservative added to the axiom-gated THEOREMS list (the REQ-9 [1'] extension brought forward for AC-7, as REQ-5 did for strat_ref_sound); the probe stays green. The faithfulness + two-phase TV + the trust flip (REQ-8 / #330) and the audit/[1'][4'][8][9] G2 gate (REQ-9 / #331) are SEPARATE downstream requirements."
