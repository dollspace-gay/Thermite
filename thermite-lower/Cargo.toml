[package]
name = "thermite-lower"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# REQ-2: depends on thermite-syntax + thermite-spec.
[dependencies]
thermite-syntax = { path = "../thermite-syntax" }
thermite-spec = { path = "../thermite-spec" }
# epic #60 (self-verification.md REQ-5): `effects::subsumes` delegates its
# bit-level mask comparison to the Verus-verified `thermite_verified::subsumes_masks`
# (mechanism (c) — the plain-Rust mirror of the proved exec body), anchoring the
# soundness-critical decision to the `verus` proof.
thermite-verified = { path = "../thermite-verified" }
