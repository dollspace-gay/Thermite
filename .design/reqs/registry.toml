title = "Exec-TV Canonical Status References"

[[view]]
name = "forge-exec-tv-status"
path = "forge/src/exec_tv.rs"
kind = "reference_list"
mode = "region"
region = "forge-exec-tv-status"
comment_prefix = "//! "
title = "Forge Exec-TV Canonical Status References"

