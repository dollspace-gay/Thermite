[[requirement]]
id = "REQ-S1-7"
title = "forge goal --proof / forge fill UX + burn receipts"
owner = ".design/stage1-forge-tier.md"
status = "shipped"
scope = "forge"
summary = "The forge-tier goal/fill UX (increment 2e) + the L3 burn receipt. (1) PROOF VIEW: `forge goal --proof` (the goal-only `--proof` flag) renders a forge-routed goal — a `lemma` or a `proof for f` obligation — WITH ITS HYPOTHESES IN SCOPE: the typed parameter binders + the `req` precondition the proof may assume (`h_req`, omitted when `req` is the trivial `true`), then the `⊢ goal` (a lemma's `ens`, or a proof-for's `ens#k` resolved 0-based against `f`'s contract), then the open `?pN` holes as the `forge fill` operands. The hypothesis context is derived structurally from the contract (the same data the Lean discharge binds — params as free inputs, `req` as the assumption), so the view needs no live elaborator. (2) FILL: `fill_hole` accepts the 2a `?pN` proof-hole addresses (a `<lemma>.proof.?pN` / `<f>.proof.<clause>.?pN`), not just body `?N`: `span_of_address`→`proof_hole_span` resolves the splice target on the forge item's proof block, the tactics are spliced + re-parsed (a malformed fill is reported), and the re-check (the Lean path) re-presents the proof view + the verdict — the 2c frozen battery refuses an unlisted tactic (cite-unlisted → refused, named), an open-hole short-circuit re-presents a hole the fill introduced (the §5.1 loop). (3) DISCHARGE + BURN: a clean (hole-free, battery-clean) `lemma` is the forge tier's self-contained goal — `export_lemma` emits the `∀ params, req → ens` theorem over the kernel-proven denotation spine (the SAME `encode_expr`/`build_registry`/`R_item` framing as the fn-contract path MINUS the body/result, so u64 overflow is modeled faithfully; a naive ℕ/ℤ encoding would be unsound), proved by the author's frozen-battery tactics; `discharge_source` runs lake + the SAME certify-time `#print axioms` gate every Lean path runs. On `Proven` it certifies L3 (the interactive trust profile — the proof is author-authored) and the certificate carries the BURN RECEIPT (`burn.proof_tokens` = the project lexer's token count over the committed proof text; `burn.cited_lemmas` = the frozen simp-lemma citations; an optional `burn.authoring_tokens` absent unless the harness supplies it). Per Q-BURN the receipt is ORACLE-EXCLUDED (re-authoring a proof changes its token count without changing the claim — like solver_time_ms), so it is NOT in `Certificate::oracle_subset` and the 7 v1 golden certs stay byte-identical. The lemma discharge lives on the Lean path only (`check_file_with_engine`/`check_file_lean`); the default Verus `check_file` is untouched (a forge-tier lemma has no Verus consumer). AC-11: the merge example (`conformance/forge/merge.th`, a merge-loop progress lemma `i < n → i + 1 <= n`) renders its hypotheses under `forge goal --proof`, `forge fill merge_advance.proof.?p0 \"<tactics>\"` closes it end to end, and the resulting certificate certifies L3 with the burn receipt (token count + cited lemmas)."
aliases = ["forge goal --proof", "forge fill", "proof view", "burn receipt", "burn.proof_tokens", "hypotheses in scope", "?pN fill", "lemma discharge", "REQ-7"]
generated_to = ["status"]

