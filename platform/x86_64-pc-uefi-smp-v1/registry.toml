schema = "ThermitePlatformRegistryBindingV1"
profile = "x86_64-pc-uefi-smp-v1"
registry_source = "thermite-kernel/src/registry.rs"
registry_symbol = "X86_64_PC_UEFI_SMP_V1"
name_pattern = "kernel::<domain>::<operation>@v1"
matcher = "name+signature+source-contract-sha256+domain+secondary-domains+capability+rights+symbol+abi+alignment+ownership+model+concurrency+failure+evidence"
unknown_entry_policy = "reject"
duplicate_entry_policy = "reject"
unreachable_entry_policy = "reject-for-complete-profile"
arbitrary_boundary_policy = "reject"

domains = [
  "boot",
  "memory",
  "mmio",
  "pio",
  "irq",
  "cpu",
  "atomic",
  "smp",
  "dma",
  "clock",
  "entropy",
  "power",
]

capabilities = [
  "BootInfo",
  "Cpu",
  "CpuSet",
  "CpuLocal",
  "PhysRegion",
  "Frame",
  "VirtRegion",
  "AddressSpace",
  "Mmio",
  "IoPort",
  "Irq",
  "IrqState",
  "TrapFrame",
  "UserContext",
  "Dma",
  "IommuDomain",
  "Clock",
  "Entropy",
  "Power",
]
