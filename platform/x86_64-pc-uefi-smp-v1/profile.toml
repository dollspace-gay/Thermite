schema = "ThermiteKernelPlatformProfileV1"
name = "x86_64-pc-uefi-smp-v1"
architecture = "x86_64"
firmware_abi = "uefi"
rust_target = "x86_64-unknown-uefi"
rust_toolchain = "1.95.0"
cpu_baseline = "x86-64"
target_features = ["sse2"]
code_model = "small"
relocation_model = "pic"
red_zone = false
panic_strategy = "abort"
entry_symbol = "efi_main"
uefi_subsystem = 10
disk_bytes = 67108864
filesystem = "fat32"
boot_path = "EFI/BOOT/BOOTX64.EFI"
source_date_epoch = 1704067200
volume_id = "5448524d"
volume_label = "THERMITE"
assurance_scope = "to_platform_boundary"

[smp]
maximum_cpus = 64
acceptance_cpus = [1, 2, 4, 8]
normative_cpus = 4
startup_timeout_microseconds = 5000000
work_per_cpu = 2048
scheduler_tasks = 4096

[firmware_protocols]
mp_services = "3fdda605-a76e-4f46-ad29-12f4531b3d08"
loaded_image = "5b1b31a1-9562-11d2-8e3f-00a0c969723b"
block_io = "964e5b21-6459-11d2-8e39-00a0c969723b"

[image_policy]
required_sections = [".text", ".rdata", ".reloc"]
forbidden_sections = [".idata"]
undefined_symbols = 0
deterministic_rebuilds = 2
publication_sentinel = "image"

[qemu]
machine = "q35"
accelerator = "tcg"
cpu = "max,-x2apic"
memory_mib = 256
boot_drive = "virtio-blk-pci,disable-modern=on"
firmware = "OVMF"

[post_firmware]
trampoline_physical = 524288
paging = "4-level,identity-low-4GiB"
interrupt_controller = "xapic"
timer = "tsc-deadline-with-apic-ipi-broker"
dma = "virtio-blk-legacy-identity-domain"
allocator = "firmware-reserved-64-page-global-allocator"
user_mode = "ring3-syscall-sysret-int81"
