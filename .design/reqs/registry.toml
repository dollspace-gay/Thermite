summary = "The G1 gate ARTIFACT (REQ-10 / AC-14): a real end-to-end demonstration that the forge tier holds together — out-of-cage clauses no longer degrade DOWN the ladder; each ESCALATES to the engine that grounds it, and the item certifies at the MIN over its clauses. (1) THE isqrt_class EXAMPLE (`conformance/forge/isqrt_class.th`): a SINGLE `fn isqrt_class(n, r)` keyed on the integer-square-root characterization `req r*r <= n && n < (r+1)*(r+1)` (with an `r <= 10^8` guard bounding the squared term for the executable covenant; the real relaxation is unaffected), whose three `ens` clauses sit at the three forge rungs, GROUNDED in `relax::classify_fn`: two RELAXABLE clauses that are NON-TRIVIAL nlsat-earned consequences of that characterization — `2*r <= n+1` (the LOWER squeeze, from `r*r<=n` and `(r-1)^2>=0`) and `n < 2*r*r + 2*r + 1` (the UPPER squeeze, from `n<(r+1)^2` and `r*r>=0`); NEITHER restates `req`, and the naive `r <= n` is correctly a RealWitness (false over ℝ for 0<r<1), never a false L4 — both route to the `NlsatEngine` real relaxation and, real-valid by the kernel-checked `r_relax_sound`, certify L4. One NON-relaxable clause (`result*2 + (n+r)%2 == n+r` — the `%` is not a polynomial atom) routes to the Lean engine, discharged L3 by the author `proof for isqrt_class { ens#2 by { simp […]; omega } }`. Item level = MIN = L3 (clauses L4, L4, L3). The `witness { inhabit …; falsify N; }` block makes it covenant-routed. (2) THE PER-CLAUSE HYBRID ROUTE (`--engine forge`, `check::forge_gate_check`/`forge_gate_item_cert`): classifies each `ens` per clause (a synthetic single-`ens` `fn` through `classify_fn`), discharges relaxable clauses via `NlsatEngine::discharge_relax` (L4) and the non-relaxable clause via the author-proof Lean discharge (reusing `lean_export::export_lemma` with `result` substituted by the body — L3 + burn), gates the covenant before the burn (R-COV-1), pins the definition-tower meaning audit, and mutation-scores the L3 clause by re-elabor