title = "Covenant engine — discharge signature + record"
owner = ".design/stage1-forge-tier.md"
status = "partial"
scope = "forge"
summary = "The foundation lands the CovenantRecord type and the non-optional &CovenantRecord parameter on Engine::discharge, threaded through VerusEngine, LeanEngine, and every call site (covenant-before-burn as a type-level seam, not a runtime convention), plus the CovenantRefuted Counterexample-class hard-fail arm in the degrade ladder."
