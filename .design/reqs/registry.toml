status = "shipped"
scope = "forge"
summary = "The STANDARD_AXIOM_ALLOWLIST check is hoisted into a shared certify-time step (certify_lean_axioms) run on EVERY Lean discharge path including the auto tiers (previously only the interactive replay checked axioms); and the exporter-surface correspondence table is authored under .design/verified and routed by the doc-drift gate. Inspection-tier — does not close audit finding F3."
