kind = "symbol"
target = "CertVerdict"

[[requirement.evidence]]
kind = "symbol"
target = "from_engine_verdict"
note = "the total, exhaustive, wildcard-free map from engine::Verdict"

[[requirement.evidence]]
kind = "symbol"
target = "is_kernel_budget_signal"
