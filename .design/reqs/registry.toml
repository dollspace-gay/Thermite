# Canonical Thermite REQ registry.
#
# Schema v1 is intentionally small: stable IDs, one owner, registry-declared
# status policy, typed evidence, tracker-neutral references, and named generated
# views. Free-form source-comment status rows remain legacy input until they are
# migrated into this registry.

schema_version = 1

[[status]]
name = "shipped"
final = true
required_evidence_any = ["file", "symbol", "test"]

[[status]]
name = "partial"
final = false
required_evidence_any = ["file", "symbol", "test"]
requires_remaining_scope = true

[[status]]
name = "blocked"
final = false
requires_blocker = true
requires_remaining_scope = true

[[status]]
name = "deferred"
final = false
requires_remaining_scope = true

[[status]]
name = "not_started"
final = false
requires_remaining_scope = true

[[view]]
name = "status"
path = ".design/reqs/status.md"
kind = "full_inventory"
mode = "region"
region = "status"
title = "Canonical REQ Status Inventory"

[[view]]
name = "thermite-tv-contract-tv-status"
path = "thermite-tv/src/lib.rs"
kind = "reference_list"
mode = "region"
region = "thermite-tv-contract-tv-status"
comment_prefix = "//! "
title = "Contract-TV Canonical Status References"

[[view]]
name = "thermite-tv-exec-tv-status"
path = "thermite-tv/src/lib.rs"
kind = "reference_list"
mode = "region"
region = "thermite-tv-exec-tv-status"
