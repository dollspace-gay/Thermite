# spec-routes.toml — the Thermite route table (single source of truth).
#
# Each route maps a toolchain source file to the design doc that governs it
# and, where one exists, the golden/conformance reference that is the
# external truth for its behavior. The spec-discipline.py hook reads this
# file to enforce "read goal.md + the design doc (+ a reference) before
# editing the file".
#
# Schema:
#   [[route]]
#   crate_pattern   = "<repo-relative path or glob>"   # required
#   design          = ".design/<area>/<doc>.md"        # required; must exist
#   reference       = ["conformance/<name>.th", ...]   # optional; if non-empty,
#                                                       #   >=1 must be Read
#   conformance_ops = ["<corpus program names>"]        # informational
#
# A file with no matching route BLOCKS until a route is added (R-XLATE-2).
# A route whose design doc doesn't exist BLOCKS until acto-doc-author
# authors it (R-XLATE-3).
#
# NOTE: This table doubles as the intended v0.1 module map. The crate/file
# layout below is the target for scaffold issue #1; adjust these routes if
# #1 settles on different paths. Routes are seeded for the v0.1 kernel
# (crosslink milestone #1); v0.2-v0.5 routes are added as the loop reaches
# them.

# ---------------------------------------------------------------------
# scaffold — workspace crate roots (issue #1)
# ---------------------------------------------------------------------

[[route]]
crate_pattern = "thermite-syntax/src/lib.rs"
design = ".design/scaffold/workspace.md"
reference = []
conformance_ops = []

[[route]]
crate_pattern = "thermite-spec/src/lib.rs"
design = ".design/scaffold/workspace.md"
reference = []
conformance_ops = []

[[route]]
crate_pattern = "thermite-lower/src/lib.rs"
design = ".design/scaffold/workspace.md"
reference = []
conformance_ops = []

[[route]]
crate_pattern = "forge/src/main.rs"
design = ".design/scaffold/workspace.md"
reference = []
conformance_ops = []

[[route]]
crate_pattern = "thermite-skill/src/lib.rs"
design = ".design/scaffold/workspace.md"
reference = []
conformance_ops = []

# ---------------------------------------------------------------------
# thermite-syntax — lexer, recovering parser, AST, semantic addressing
#   (issues #1 scaffold, #3 parser). Owns the SURFACE grammar (the whole
#   language: fn/req/ens/fx/loop/inv/dec/spec fn/#[slag]); the parser is the
#   grammar's executable form, spec'd by .design/syntax/ + the conformance
#   corpus. Registry-free (does not depend on thermite-spec).
# ---------------------------------------------------------------------

[[route]]
crate_pattern = "thermite-syntax/src/lexer.rs"
design = ".design/syntax/lexer.md"
reference = []
conformance_ops = []

[[route]]
crate_pattern = "thermite-syntax/src/parser.rs"
design = ".design/syntax/parser.md"
reference = ["conformance/parse"]
conformance_ops = ["binary_search", "sum", "recover_per_item"]

[[route]]
crate_pattern = "thermite-syntax/src/ast.rs"
design = ".design/syntax/ast.md"
reference = []
conformance_ops = []

[[route]]
crate_pattern = "thermite-syntax/src/address.rs"
design = ".design/syntax/semantic-addressing.md"
reference = ["conformance/address"]
conformance_ops = ["binary_search.loop#1.inv#2"]

# ---------------------------------------------------------------------
# thermite-spec — the SpecTherm combinator registry (issue #2)
#   Built just before thermite-lower (#4) — its first in-workspace consumer.
#   The parser (#3) does NOT depend on this crate: it parses combinator calls
#   as generic call expressions; the "only a fixed combinator set" rule
#   (design §4.2) is a SEMANTIC check enforced here, not a grammar rule. So
#   #2 and #3 are independent leaves and #4 depends on both. The SURFACE
#   grammar is a thermite-syntax concern (governed by .design/syntax/), not a
#   thermite-spec one — there is no thermite-spec/src/grammar.rs route.
# ---------------------------------------------------------------------

[[route]]
crate_pattern = "thermite-spec/src/combinators.rs"
design = ".design/spec/spectherm-combinators.md"
reference = ["tests/golden/combinators"]
conformance_ops = ["forall_in", "forall_below", "forall_from", "sorted", "permutation_of", "disjoint", "count_where", "exists_in"]

[[route]]
crate_pattern = "thermite-spec/src/validator.rs"
design = ".design/spec/spectherm-combinators.md"
reference = ["tests/golden/combinators"]
conformance_ops = ["accept", "reject"]

