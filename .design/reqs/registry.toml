l_qfree_iff is the <-> corollary, the Cls analogue of sdenote_qf_canonical. Imports Strat.Soundness + the v1 Thermite.Denote — deliberately NOT the spine Strat.Denote, which would re-introduce the #68 two-syntax probe collision the .Cls split fixed; the v1 deferral seam is reproduced on the Cls atom set directly. (2) thermite-lower production quantifier emission (lower.rs Expr::Quantifier): the pre-REQ-8 honest refusal (LowerError::Unsupported) is replaced by the real (R2) index-grammar emission — forall|x: int| 0 <= x < <dom>.len() ==> (<body>) / exists|x: int| ... && (...), TRIGGER-FREE (the MBQI surface T1-S strat_ref_wf certifies, matching sencode's triggerFree:=true). (3) thermite-tv/src/strat_ref_encode.rs: the INDEPENDENT stratified reference encoder (classifier::Frm -> normalize::Formula), the Rust analogue of RefEncode.lean sencode (de Bruijn LEVEL naming encName d i = d-1-i, no capture); depends on thermite-spec only (never thermite-lower — the TV honesty boundary). (4) thermite-tv/src/strat_two_phase.rs: the two-phase TV per §8.2 — phase 1 SYNTACTIC (the SPIKE-2 normalizer carrying nnf_sound/prenex_sound, the dominant path: SPIKE-2 measured 40/40=100% syntactic) -> phase 2 SEMANTIC (the negation-unfriendly quantified-equivalence Z3 query with finite-bound assertions, the thin rarely-hit fallback); count_where/permutation_of (no raw-quantifier spelling, REQ-6) route ClauseRoute::DirectSemantic; an honest Timeout WITHHOLDS the certificate (TvVerdict::Withheld, never a false pass); run_two_phase reports the syntactic/semantic/timeout/divergent PhaseSplit. (5) THE TRUST FLIP: G2_FLIPPED (the one-line gate, false during rollout) + strat_trust_profile(g2_proven) — pre-G2 a certified stratified clause reads trust: solver(z3) + ref_encode(strat, UNPROVEN — stage 2 in progress); the proven form ref_encode(strat) is the single-line G2_FLIPPED edit, gated on REQ-9's [1'][4'][8][9] audit (the flip must NOT trigger on REQ-5 structural soundness alone — it attests 'proven over source meaning', REQ-8's atom-grounding). (6) forge/src/strat_faithful.rs + forge strat-faithful-tv: the forge orchestrator — run the two-phase TV over generated clauses, report the phase split + the per-clause trust profile under the gate; a divergence or withhold is a verification-failure exit. AC-8 met: thermite-tv/tests/strat_two_phase_corpus.rs runs the two-phase TV over the stratified corpus (40 SPIKE-2 fixtures, all syntactic) + generated clauses reporting the phase split; the trust string reads the UNPROVEN form before G2 and the proven form after, exercised by the gate-toggle tests (trust_profile_reads_unproven_before_g2_and_proven_after, the_flip_is_a_tested_code_path); thermite-lower/tests/strat_quantifier_lower.rs pins the production emission. strat_lowering_faithful proven axiom-clean (in-file + lean-axiom-probe THEOREMS: [propext, Classical.choice, Quot.sound]; Classical via the decide over the Prop-valued v1 denote), zero sorry under lean/Thermite/Strat/, core-Lean path (no Mathlib). Thermite.Strat.Faithfulness wired into scripts/lean-axiom-probe.sh as a CI build target + Thermite.Strat.strat_lowering_faithful added to the axiom-gated THEOREMS (the REQ-9 [1'] extension brought forward for AC-8, as REQ-5/REQ-7 did). cargo test/clippy -D warnings/fmt clean. The audit/[1'][4'][8][9] G2 gate + the real Z3 discharge of the semantic phase (REQ-9 / #331) is the SEPARATE downstream requirement."
