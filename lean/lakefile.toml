# The Lean 4 side of the Thermite toolchain — the verified-validator metatheory
# (.design/verified/thermite-semantics.md REQ-5/REQ-6/REQ-7; epic #169).
#
# Z3-DEMOTION ATTEMPT (increment 4a, #184): this lakefile is the Tier-2 probe —
# add Lean-SMT (github.com/ufmg-smite/lean-smt) so a TV equivalence obligation can be
# discharged by the `smt` tactic (cvc5 proof reconstruction) and KERNEL-CHECKED rather
# than Z3-trusted. Lean-SMT main pins toolchain v4.29.0 + full Mathlib + lean-cvc5
# (a vendored cvc5 static lib via FFI). The lean-toolchain here is pinned to v4.29.0 to
# match; the entire existing proof spine still builds green on v4.29.0 (verified before
# adding the dep — see the builder report / .design/verified/z3-demotion.md).

name = "thermite"
defaultTargets = ["Thermite"]

# Pinned to a SHA (not the `main` branch) so a manifest refresh cannot float the
# dependency upstream unobserved (trust-audit finding F4). This is the commit
# `lake-manifest.json` already locks; pinning it here makes the requirement and the
# lockfile agree, so the Lean CI job's `lake build` is reproducible.
[[require]]
name = "smt"
git = "https://github.com/ufmg-smite/lean-smt.git"
rev = "7d1d8239e78daa5197f9a71948776c4627049f5f"

[[lean_lib]]
name = "Thermite"
