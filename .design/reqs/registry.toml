status = "shipped"
scope = "forge"
summary = "The closed seven-verdict cert-level enum (CertVerdict: Proved, Counterexample, RealWitness, CovenantRefuted, Stuck, KernelBudget, Timeout) as a SEPARATE type; a total, exhaustive, wildcard-free map from the three-arm engine::Verdict (no Unknown survives into a certificate); the KernelBudget kernel/elaboration-budget discriminator (Q-KBSIGNAL — a distinct Lean signal, never confusable with the solver rlimit text); and the additive schema-v2 per-clause engine/trust/verdict block that keeps the v1 golden oracle byte-identical."
aliases = ["verdict plumbing", "seven verdicts", "CertVerdict", "REQ-1"]
generated_to = ["status"]

