# ---------------------------------------------------------------------
# Stage 1 — the forge tier (REQ cluster, .design/stage1-forge-tier.md).
# The increments landed in this stage: REQ-8a (relax spine lemmas), REQ-1
# (verdict plumbing), REQ-2 (exporter hardening), all SHIPPED; REQ-4 (covenant)
# PARTIAL — the foundation signature/record landed, the covenant logic is 2b.
# The remaining stage-1 clusters (REQ-3 surface syntax, REQ-5 battery, REQ-6
# anti-Goodhart, REQ-7 goal/fill, REQ-8b relax route, REQ-9 lemma library,
# REQ-10 gate G1) are not started here and are intentionally not yet registered.
# ---------------------------------------------------------------------

[[requirement]]
id = "REQ-S1-8A"
title = "Real-relaxation spine lemmas"
owner = ".design/stage1-forge-tier.md"
status = "shipped"
scope = "verified"
summary = "The two nlsat real-relaxation soundness lemmas — rencode_sound (the ℤ→ℝ polynomial encoding is a ring hom) and r_relax_sound (the real relaxation discharges the integer clause) — land in a single Mathlib-island module, kernel-clean (axioms ⊆ {propext, Classical.choice, Quot.sound}), with the shared axiom probe extended to both and run in CI (trust-audit finding F4)."
aliases = ["relax spine lemmas", "r_relax_sound", "rencode_sound", "REQ-8a"]
generated_to = ["status"]

