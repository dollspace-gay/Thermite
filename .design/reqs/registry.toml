[[requirement]]
id = "REQ-S1-3"
title = "Forge-tier surface syntax"
owner = ".design/stage1-forge-tier.md"
status = "partial"
scope = "syntax"
summary = "thermite-syntax parses the forge-tier surface forms beside `fn` — `prop fn`, `lemma … req … ens … proof { … }`, `proof for f { ens#k by { … } }`, `witness { inhabit (…); falsify N; }`, `?pN` proof holes, refinement-type sugar `x: T{P}` (folded to req/ens in a NEW post-parse desugar pass), and the ASCII `dec lex(…)` / `dec wf <rel>` measures (Q-DECWF, no Unicode operator lexing) — into the AST (grouped under one additive `Item::Forge` variant), with semantic addressing (`f.proof.ens#k`, the `?pN` form, `witness#N`) and the hole-gating surface (an open `?pN` blocks build + certification). Proof-block tactic content is captured VERBATIM (not structurally parsed — that is the frozen battery, REQ-5). Always-on, no feature flag; gating is forge-side via holes/routing. Byte-stable: no conformance `.th` uses the new syntax, so the oracle is unchanged."
remaining_scope = "Surface only — the SEMANTIC consumers of the parsed forms are later increments and are NOT built here: covenant inhabit/falsify execution (increment 2b, REQ-S1-4), the frozen tactic battery that parses proof-block content (2c, REQ-5), anti-Goodhart re-elaboration (2d, REQ-6), the goal/fill proof view that fills `?pN` (2e, REQ-7), the relax engine (2f, REQ-8b), and the lemma-library mechanics that consume `lemma`/`proof`/`dec wf` (3, REQ-9). The forge dispatches every `Item::Forge` through an inert arm today (no v1 cert/lowering consumer), EXCEPT the AC-7 open-`?pN` build/cert refusal which is wired."
aliases = ["surface syntax", "forge-tier syntax", "prop fn", "lemma", "proof for", "witness", "?pN proof holes", "refinement sugar", "dec wf", "dec lex", "REQ-3"]
