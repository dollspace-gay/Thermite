[package]
name = "forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# REQ-1: forge is the sole binary crate (the CLI).
[[bin]]
name = "forge"
path = "src/main.rs"

# REQ-2: depends on all three libs + thermite-skill.
[dependencies]
thermite-syntax = { path = "../thermite-syntax" }
thermite-spec = { path = "../thermite-spec" }
thermite-lower = { path = "../thermite-lower" }
thermite-skill = { path = "../thermite-skill" }
# contract-TV (epic #139, #144): the INDEPENDENT contract-faithfulness reference
# encoder + the per-clause Z3 equivalence obligation. forge is the ONLY place the
# independent `thermite-tv` reference meets the production `thermite-lower`
# lowering (`contract_tv.rs` discharges `P_production <==> P_reference`);
# `thermite-tv` itself stays free of any `thermite-lower` dep (the N-version
# independence boundary, AC-6).
thermite-tv = { path = "../thermite-tv" }
# #5: the certificate schema (`manifest.rs`) is serde-serialized to the §5.1
# stable JSON; `check.rs` parses verus's `--output-json` summary with serde_json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# #8: the per-item content-addressed proof cache (`cache.rs`) hashes the four
# verdict-determining inputs (lowered source + seed + verus version + thermite
# version) into a stable sha256 content address (`.design/forge/proof-cache.md`
# REQ-1).
sha2 = "0.10"

# Stage-3 REQ-2 (`.design/stage3-bv-reconstruction.md`): the `@bv` shadow-flag
# plumbing. Enabling forge's `bv` feature turns on `thermite-syntax/bv` so the
# parser accepts `ens@bvN` / `@bvN(nowrap)` tags (REQ-1's structural lock), making the
# `--engine bv` bit-vector route reachable end to end. NON-DEFAULT and loud: a release
# build without it cannot parse the tag (gate G3, R-BV-1). The route code is always
# compiled (it reads the always-present `Clause.bv: Option<BvTag>`), so only the parse
# gate is feature-conditional.
[features]
default = ["bv"]
bv = ["thermite-syntax/bv"]

# epic #60 (self-verification, REQ-7/REQ-8): the Verus-verified soundness-critical
# core. A DEV-dependency only — the in-module `verus_anchor` tests in `degrade.rs`
# (the ladder anti-cheat decision) and `sandbox.rs` (the seccomp allowlist
# soundness) bind the PRODUCTION decision fns to the verus-proved plain-Rust mirrors
# (`thermite_verified::ladder_action_*_tag` / `io_allow`) over their finite domains
# (mechanism (c)). NOT a runtime dep: forge's production code does not consume it.
[dev-dependencies]
thermite-verified = { path = "../thermite-verified" }
