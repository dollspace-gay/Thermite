summary = "The relax route (increment 2f, REQ-8b/8c): out-of-cage polynomial clauses no longer degrade DOWN the ladder — they escalate UP to the forge's kernel-grounded L4 rung. (1) RELAXABLE CLASSIFIER (`relax::classify_fn`): a contract is relaxable iff it is universally quantified over integer-scalar params + result and every clause atom is polynomial — variables, integer literals, `+`/`-`/`*`, comparisons, boolean connectives — with NO div/mod/shifts/casts (those are non-polynomial over ℝ / bit-level / carrier-changing, so the real relaxation would be unfaithful and the spine lemmas would not apply). (2) NLSAT ENGINE (`engine::NlsatEngine`, `EngineName::Nlsat`): a NEW Engine-trait impl issuing a DIRECT Z3 nlsat-tactic (QF_NRA) query (Q-NLSAT — the first real-arithmetic Z3 query as its own engine; today Z3 is reached only through Verus). The fragment is narrowed (`admits_relax` = the relaxable check, `admits_all_classes = false`), reached via the conditional `--engine nlsat` dispatch in check.rs (the default Verus path + `--engine lean|auto` untouched). The query asserts the negated contract `req ∧ ¬(⋀ ens)` over the reals (with an unsigned-domain ≥0 guard); `unsat` → real-valid → (by the kernel-checked `r_relax_sound`) integer-valid → certify L4. (3) INTEGRALITY CHECK (Q8): on `sat`, round the real model into a radius-2 ℤⁿ box and evaluate the integer clause; an integer falsifier is a genuine Counterexample, none is a real-only countermodel. (4) REALWITNESS: a clause true over ℤ but false over ℝ (e.g. `∀ n. n*n ≠ 2`) yields the CertVerdict::RealWitness verdict carrying the raw real point (√2), escalated to the forge as goal metadata — NEVER a Counterexample. Attribution reuses Certificate::with_engine_attribution (engine: nlsat; trust profile = solver(nlsat) + the kernel-checked spine lemmas). (5) L4 LADDER: manifest.rs::Level gains L4 (L0<L1<L2<L3<L4) — L3 is the Verus/Z3 SOLVER rung, L4 is KERNEL-GROUNDED; additive, so the v1 corpus stays L3 and oracle_subset is byte-identical. The v1 ladder docs (thermite-design.md, degrade-ladder.md) are reconciled to the new RFC-1/GH #2 ladder, and the divergence_249 pin's level language is re-anchored (a cheat is never Proved at any proven rung, L3 OR L4). AC-12: relaxable admits the isqrt postconditions + rejects a div clause; isqrt certifies L4 push-button with engine: nlsat; `∀ n. n*n≠2` yields RealWitness, never Counterexample; the axiom probe covers r_relax_sound + rencode_sound (REQ-S1-8A)."
