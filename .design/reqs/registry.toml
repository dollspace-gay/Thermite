# Canonical Thermite REQ registry.
#
# Schema v1 is intentionally small: stable IDs, one owner, registry-declared
# status policy, typed evidence, tracker-neutral references, and named generated
# views. Free-form source-comment status rows remain legacy input until they are
# migrated into this registry.

schema_version = 1

[[status]]
name = "shipped"
final = true
required_evidence_any = ["file", "symbol", "test"]

[[status]]
name = "partial"
final = false
required_evidence_any = ["file", "symbol", "test"]
requires_remaining_scope = true

[[status]]
name = "blocked"
final = false
requires_blocker = true
requires_remaining_scope = true

[[status]]
name = "deferred"
final = false
requires_remaining_scope = true

[[status]]
name = "not_started"
final = false
requires_remaining_scope = true

[[view]]
name = "status"
path = ".design/reqs/status.md"
kind = "full_inventory"
mode = "region"
region = "status"
title = "Canonical REQ Status Inventory"

[[requirement]]
id = "REQ-REG-1"
title = "Stable requirement identity and ownership"
owner = ".design/tooling/req-registry.md"
status = "shipped"
scope = "tooling"
summary = "Each canonical requirement has a stable ID, title, owner, status, scope, generated view membership, and typed evidence."
aliases = ["registry identity", "REQ status registry identity"]
generated_to = ["status"]

[[requirement.evidence]]
kind = "file"
target = ".design/reqs/registry.toml"
note = "schema v1 registry source"

[[requirement.evidence]]
kind = "doc"
target = ".design/tooling/req-registry.md"
note = "governing design contract"

[[requirement]]
id = "REQ-REG-2"
title = "Registry-declared status policy"
owner = "tooling/req-registry.py"
status = "shipped"
scope = "tooling"
summary = "Registry statuses are declared by the registry, not hard-coded by the checker."
generated_to = ["status"]

[[requirement.evidence]]
kind = "symbol"
target = "StatusRule"
note = "status policy model"

[[requirement.evidence]]
kind = "test"
target = "tooling/tests/test_req_registry.py::ReqRegistryOracleTest.test_rejects_unknown_status"
note = "requirements may only use declared statuses"

[[requirement]]
id = "REQ-REG-3"
title = "Typed evidence validation"
owner = "tooling/req-registry.py"
status = "shipped"
scope = "tooling"
summary = "Evidence entries carry an explicit kind and target; path, symbol, issue, and blocker references are validated mechanically."
generated_to = ["status"]

[[requirement.evidence]]
kind = "symbol"
target = "VALID_EVIDENCE_KINDS"
note = "accepted evidence kind set"

[[requirement.evidence]]
kind = "test"
target = "tooling/tests/test_req_registry.py::ReqRegistryOracleTest.test_rejects_unresolved_file_evidence"
note = "path evidence must resolve"

[[requirement.evidence]]
kind = "test"
target = "tooling/tests/test_req_registry.py::ReqRegistryOracleTest.test_blocked_requires_issue_blocker"
note = "future status blockers are typed"

[[requirement]]
id = "REQ-REG-4"
title = "Generated status views"
owner = "tooling/req-registry.py"
status = "shipped"
scope = "tooling"
summary = "Generated markdown views are rendered deterministically from the registry and checked in CI for staleness."
generated_to = ["status"]

[[requirement.evidence]]
kind = "symbol"
target = "render_full_inventory"
note = "status view renderer"

[[requirement.evidence]]
kind = "test"
target = "tooling/tests/test_req_registry.py::ReqRegistryOracleTest.test_check_detects_stale_generated_view"
note = "stale generated output is a failing condition"

[[requirement.evidence]]
kind = "command"
target = "python3 tooling/req-registry.py --check"
note = "CI-facing generated-view check"

[[requirement]]
id = "REQ-REG-5"
title = "Legacy source-comment bridge"
owner = "tooling/req-status.py"
status = "partial"
scope = "tooling"
summary = "The existing source-comment lint remains as a bridge while repeated `//!` REQ rows are mapped to stable registry IDs."
remaining_scope = "Migrate the 429 legacy source-comment rows into stable registry IDs, then replace hand-maintained tables with generated regions or links."
contributors = ["tooling/req-registry.py"]
blockers = ["github:dollspace-gay/Thermite#17"]
generated_to = ["status"]

[[requirement.evidence]]
kind = "file"
target = "tooling/req-status.py"
note = "short-term contradiction tripwire"

[[requirement.evidence]]
kind = "command"
target = "python3 tooling/req-status.py"
note = "legacy row lint stays green during migration"

[[requirement]]
id = "REQ-REG-6"
title = "Generated-region migration"
owner = ".design/tooling/req-registry.md"
status = "deferred"
scope = "tooling"
summary = "Source comments should eventually carry stable invariants only; volatile status tables should be generated or linked from canonical status views."
remaining_scope = "Define generated-region markers and migrate source comments doc-by-doc after stable ID mapping is reviewed."
blockers = ["github:dollspace-gay/Thermite#17"]
generated_to = ["status"]

[[requirement.evidence]]
kind = "issue"
target = "github:dollspace-gay/Thermite#17"
note = "RFC tracking the full migration plan"

# ---------------------------------------------------------------------
# Stage 1 — the forge tier (REQ cluster, .design/stage1-forge-tier.md).
# The increments landed in this stage: REQ-8a (relax spine lemmas), REQ-1
# (verdict plumbing), REQ-2 (exporter hardening), all SHIPPED; REQ-4 (covenant)
# PARTIAL — the foundation signature/record landed, the covenant logic is 2b.
# The remaining stage-1 clusters (REQ-3 surface syntax, REQ-5 battery, REQ-6
# anti-Goodhart, REQ-7 goal/fill, REQ-8b relax route, REQ-9 lemma library,
# REQ-10 gate G1) are not started here and are intentionally not yet registered.
# ---------------------------------------------------------------------

[[requirement]]
id = "REQ-S1-8A"
title = "Real-relaxation spine lemmas"
owner = ".design/stage1-forge-tier.md"
status = "shipped"
scope = "verified"
summary = "The two nlsat real-relaxation soundness lemmas — rencode_sound (the ℤ→ℝ polynomial encoding is a ring hom) and r_relax_sound (the real relaxation discharges the integer clause) — land in a single Mathlib-island module, kernel-clean (axioms ⊆ {propext, Classical.choice, Quot.sound}), with the shared axiom probe extended to both and run in CI (trust-audit finding F4)."
aliases = ["relax spine lemmas", "r_relax_sound", "rencode_sound", "REQ-8a"]
generated_to = ["status"]

[[requirement.evidence]]
kind = "file"
target = "lean/Thermite/Relax.lean"
note = "the Mathlib-island module"

[[requirement.evidence]]
kind = "symbol"
target = "r_relax_sound"
note = "relaxation soundness lemma"

[[requirement.evidence]]
kind = "symbol"
target = "rencode_sound"
note = "real-encoding ring-hom lemma"

[[requirement.evidence]]
kind = "file"
target = "scripts/lean-axiom-probe.sh"
note = "the shared lake-build + #print-axioms gate, run by the Lean CI job and make audit check [1]"

[[requirement]]
id = "REQ-S1-1"
title = "Seven-verdict certificate vocabulary"
owner = ".design/stage1-forge-tier.md"
status = "shipped"
scope = "forge"
summary = "The closed seven-verdict cert-level enum (CertVerdict: Proved, Counterexample, RealWitness, CovenantRefuted, Stuck, KernelBudget, Timeout) as a SEPARATE type; a total, exhaustive, wildcard-free map from the three-arm engine::Verdict (no Unknown survives into a certificate); the KernelBudget kernel/elaboration-budget discriminator (Q-KBSIGNAL — a distinct Lean signal, never confusable with the solver rlimit text); and the additive schema-v2 per-clause engine/trust/verdict block that keeps the v1 golden oracle byte-identical."
aliases = ["verdict plumbing", "seven verdicts", "CertVerdict", "REQ-1"]
generated_to = ["status"]

[[requirement.evidence]]
kind = "file"
target = "forge/src/verdict.rs"
note = "the cert-level verdict enum + construction sites"

