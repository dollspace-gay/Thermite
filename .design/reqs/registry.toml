summary = "The lemma library mechanics (increment 3, REQ-9 — the LAST stage-1 feature increment; it trails usage because it reasons about already-discharged lemma certificates). (1) PER-PROJECT LEMMA NAMESPACE (Q1): a project's top-level `lemma` items form a namespace (`lemma_library::LemmaLibrary`, built from the parsed program + the settled cert collection); ONLY a top-level `lemma` enters it, never a proof-local `have`/`let` binding, so the namespace is the SOLE cross-function citation surface (Q6: no cross-function sharing except via a lemma; a `proof for f` block's several `ens#k` obligations share that one function's local context, structurally enforced by building the namespace from top-level lemmas only). (2) CERTIFIED-ONLY CITATION RESOLUTION (AC-13): a `simp [ … ]` citation resolves against the frozen battery OR a CERTIFIED project lemma; a citation to a project lemma that did NOT certify is REFUSED, named (`lemma_library::enforce_citations` → `UncertifiedCitation`, cause `UncertifiedLemmaCitation`). The frozen-battery gate is taught to DEFER a project-lemma citation (`battery::enforce_with_project_lemmas`) so the certified-only resolution decides it on the forge/Lean path (`check::apply_lemma_library`, run after the lemma discharge pass). (3) DEDUP-ON-BURN BY STATEMENT HASH (Q1 / AC-13): `lemma_library::statement_hash` hashes a lemma's params + `req` + `ens` (NAME- and PROOF-excluded, span-free), so two identical-statement lemmas under different names are ONE proven fact — only the first (canonical) is stored and a citation to the duplicate is REWRITTEN to the canonical (`rewrite_citations`), applied to the burn receipt's `cited_lemmas` (oracle-excluded, so the v1 goldens stay byte-identical). (4) DEC WF ACCESSIBILITY CACHE (Q7 / AC-13): a `dec wf <rel>` measure's accessibility proof is content-addressed by the (relation, carrier) pair (`cache::accessibility_cache_key` + `AccessibilityProof` + `load_accessibility`/`store_accessibility`), invalidated by the same `CHECK_SCHEMA_VERSION` gate key as the per-item proof cache; a write-through pass (`accessibility::cache_dec_wf_accessibility`) populates it on the forge path so a `dec wf` re-check on an unchanged (relation, carrier) HITS the cache (the cross-invocation hit the per-item proof cache uses, observable via the cache layer). (5) REVIEW SURFACING: a certified `lemma` carrying a burn receipt surfaces in `forge review` like any certified item (`review::BurnedLemma`, the `burned_lemmas` partition + the human render). All additive: no v1 corpus item is forge-tier / uses `dec wf` / cites a project lemma, so the v1 oracle is untouched. AC-13: citing an uncertified lemma fails with the lemma named; burning a statement-hash duplicate rewrites the citation (two identical lemmas under different names → one stored); a dec wf re-check hits the accessibility cache."
