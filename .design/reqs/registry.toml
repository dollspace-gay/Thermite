[[requirement]]
id = "REQ-S1-4"
title = "Covenant engine — discharge signature + record"
owner = ".design/stage1-forge-tier.md"
status = "partial"
scope = "forge"
summary = "The foundation lands the CovenantRecord type and the non-optional &CovenantRecord parameter on Engine::discharge, threaded through VerusEngine, LeanEngine, and every call site (covenant-before-burn as a type-level seam, not a runtime convention), plus the CovenantRefuted Counterexample-class hard-fail arm in the degrade ladder."
remaining_scope = "The covenant LOGIC is increment 2b: inhabit witnesses type-checked + executed against req, the falsify generator run (Q3 fixed-seed 50_000) against the executable semantics, the covenant-before-burn enforcement, and the CovenantRefuted producer. Today every program carries CovenantRecord::none() — the witness surface syntax is REQ-3, not yet present."
aliases = ["covenant engine", "covenant-before-burn", "REQ-4"]
generated_to = ["status"]

